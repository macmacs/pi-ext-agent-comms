name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: extractions/setup-just@v4
      - run: npm ci
      # The RPC harnesses spawn `pi`; pin the same version as the dev dependencies.
      - run: npm i -g @earendil-works/pi-coding-agent@0.84.3
      - run: just check
      # Clones the git install from GitHub and compares it to origin/main, so
      # it is only meaningful for a push to main, not for a PR head.
      - name: git install check
        if: github.event_name == 'push'
        run: just check-install
